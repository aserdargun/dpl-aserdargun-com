    <div id="root"></div>
    <noscript>
      <div lang="en">
        <h1>DPL — Decision Plane Laboratory</h1>
        <p>
          An independent, deterministic simulation of a decision plane. It shows
          how a policy takes a short path, evaluates further, asks for
          evidence, waits for approval, abstains or blocks an action. No
          scenario action is actually executed.
        </p>
        <ul>
          <li>Six versioned scenarios, from clear tasks to untrusted content.</li>
          <li>Three decision policies: Fast-first, Deep-first and Adaptive.</li>
          <li>An ordered gate contract with a step budget, abstention and blocking.</li>
          <li>Evidence requests, human approval and a readable run trace.</li>
          <li>Side-by-side policy comparison and JSON run export.</li>
        </ul>
        <p>
          This interactive laboratory needs JavaScript. Its scenarios, policies
          and results are educational design choices, not validated measurements.
        </p>
      </div>
    </noscript>
